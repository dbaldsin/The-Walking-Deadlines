services:
  opencode:
    build: .
    ports:
      # Only reachable from the VM itself; Nginx proxies public traffic here.
      - "127.0.0.1:4096:4096"
    volumes:
      # Keep sessions, auth and config across container rebuilds.
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    restart: unless-stopped

volumes:
  opencode-data:
  opencode-config:
