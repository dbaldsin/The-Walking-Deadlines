# Copy to /etc/nginx/sites-available/opencode on the VM and symlink it into
# sites-enabled. The certificate and key for this hostname live in /root.

server {
    listen 80;
    listen [::]:80;
    server_name crs-17313-the-walking-deadlines.qatar.cmu.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crs-17313-the-walking-deadlines.qatar.cmu.edu;

    ssl_certificate     /root/crs-17313-the-walking-deadlines.qatar.cmu.edu-fullchain.crt;
    ssl_certificate_key /root/crs-17313-the-walking-deadlines.qatar.cmu.edu.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent responses stream over SSE; don't buffer or time them out early.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
